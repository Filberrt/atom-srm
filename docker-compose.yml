services:
  postgres:
    image: postgres:16-alpine
    container_name: oneex_srm_postgres
    environment:
      POSTGRES_DB: oneex_srm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - oneex_srm_pgdata:/var/lib/postgresql/data

volumes:
  oneex_srm_pgdata:
